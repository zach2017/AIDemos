version: "3.9"

services:
  api:
    build: ./api
    container_name: chroma-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./web:/app/web:ro
      - ./api/scripts:/app/scripts:ro
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h

volumes:
  ollama_models:
