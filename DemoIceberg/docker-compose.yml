
services:
  iceberg-webapp:
    # This tells Compose to build the image from the Dockerfile in the ./app directory
    build: ./app
    container_name: iceberg-webapp
    depends_on:
      # Ensures chroma and ollama are started before the webapp
      chroma:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      # Environment variables passed to your streamlit app
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434 # Default ollama port
    volumes:
      # Mounts your local ./app directory into the container.
      # Great for development, as changes to your .py file are reflected instantly.
      - ./app:/app
    networks:
      - iceberg-network
    healthcheck:
      # This is the healthcheck you provided
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  chroma:
    image: chromadb/chroma # Using a recent stable version
    container_name: iceberg-chroma
    ports:
      - "8000:8000"
    volumes:
      # Persists chroma data to a named volume
      - chroma_data:/chroma/chroma
    networks:
      - iceberg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: iceberg-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persists ollama models and data
      - ollama_data:/root/.ollama
    networks:
      - iceberg-network
    healthcheck:
      # Simple check to see if the ollama process is running
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  iceberg-network:
    driver: bridge

volumes:
  # Defines the named volumes for persistent data
  chroma_data:
  ollama_data: