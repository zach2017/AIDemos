<!-- src/main/resources/static/error.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Something went wrong</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .error-message {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 5px;
        }

        .error-details-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .error-details-content {
            color: #666;
            font-size: 0.9em;
            word-break: break-word;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .support-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
            color: #999;
            font-size: 0.9em;
        }

        .support-info a {
            color: #667eea;
            text-decoration: none;
        }

        .support-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <div class="error-code" id="errorCode">Error</div>
        <h1 id="errorTitle">Oops! Something went wrong</h1>
        <p class="error-message" id="errorMessage">
            We're sorry, but we encountered an unexpected error while processing your request.
        </p>

        <div class="error-details" id="errorDetails" style="display: none;">
            <div class="error-details-title">Error Details:</div>
            <div class="error-details-content" id="errorDetailsContent"></div>
        </div>

        <div class="button-group">
            <a href="/" class="btn btn-primary">
                🏠 Go Home
            </a>
            <button onclick="window.history.back()" class="btn btn-secondary">
                ← Go Back
            </button>
        </div>

        <div class="support-info">
            <p>If this problem persists, please contact support.</p>
            <p style="margin-top: 10px;">
                <strong>Timestamp:</strong> <span id="timestamp"></span>
            </p>
        </div>
    </div>

    <script>
        // Display current timestamp
        document.getElementById('timestamp').textContent = new Date().toLocaleString();

        // Try to get error details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const status = urlParams.get('status');
        const message = urlParams.get('message');
        const path = urlParams.get('path');

        // Check if we're being served by the error controller (look for Spring Boot error attributes)
        // Otherwise, use URL parameters or show generic error

        if (status) {
            document.getElementById('errorCode').textContent = status;
            
            // Customize message based on status code
            let icon = '⚠️';
            let title = 'Error';
            let description = message || 'An error occurred';

            switch(status) {
                case '400':
                    icon = '🚫';
                    title = 'Bad Request';
                    description = 'The request could not be understood by the server.';
                    break;
                case '401':
                    icon = '🔒';
                    title = 'Unauthorized';
                    description = 'You need to be authenticated to access this resource.';
                    break;
                case '403':
                    icon = '⛔';
                    title = 'Forbidden';
                    description = 'You don\'t have permission to access this resource.';
                    break;
                case '404':
                    icon = '🔍';
                    title = 'Page Not Found';
                    description = 'The page you\'re looking for doesn\'t exist.';
                    break;
                case '500':
                    icon = '💥';
                    title = 'Internal Server Error';
                    description = 'Something went wrong on our end. Please try again later.';
                    break;
                case '502':
                    icon = '🔌';
                    title = 'Bad Gateway';
                    description = 'The server received an invalid response.';
                    break;
                case '503':
                    icon = '🛠️';
                    title = 'Service Unavailable';
                    description = 'The service is temporarily unavailable. Please try again later.';
                    break;
                default:
                    icon = '⚠️';
                    title = 'Error ' + status;
            }

            document.querySelector('.error-icon').textContent = icon;
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = description;

            // Show error details if available
            if (message || path) {
                let details = '';
                if (message) details += `<div><strong>Message:</strong> ${message}</div>`;
                if (path) details += `<div style="margin-top: 5px;"><strong>Path:</strong> ${path}</div>`;
                
                document.getElementById('errorDetailsContent').innerHTML = details;
                document.getElementById('errorDetails').style.display = 'block';
            }
        }

        // Add retry button for 5xx errors
        if (status && status.startsWith('5')) {
            const retryBtn = document.createElement('button');
            retryBtn.className = 'btn btn-primary';
            retryBtn.innerHTML = '🔄 Retry';
            retryBtn.onclick = () => window.location.reload();
            document.querySelector('.button-group').insertBefore(
                retryBtn, 
                document.querySelector('.button-group').firstChild
            );
        }
    </script>
</body>
</html>
