

services:
  # Flask Web Application
  web:
    build: .
    container_name: embeddings_web
    ports:
      - "5000:5000"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    environment:
      - FLASK_ENV=development
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - app_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_network
    restart: unless-stopped
    # Optional: Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  app_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
