version: '3.8'

services:
  # LocalStack for S3 emulation
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./localstack-data:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - iceberg-network

  # Spark with Iceberg support
  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    container_name: spark-iceberg
    build: ./docker/spark/
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    ports:
      - "8888:8888"
      - "8080:8080"
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ./notebooks:/home/iceberg/notebooks
      - ./data:/home/iceberg/data
      - ./scripts:/home/iceberg/scripts
    networks:
      - iceberg-network
    command: notebook

  # Chroma Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - iceberg-network

  # Ollama for embeddings and LLM
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    networks:
      - iceberg-network

  # Python application container
  app:
    build: ./docker/app/
    container_name: iceberg-app
    depends_on:
      - localstack
      - spark-iceberg
      - chroma
      - ollama
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_HOST=ollama
      - OLLAMA_PORT=11434
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - iceberg-network
    command: tail -f /dev/null

  # Streamlit Web App
  webapp:
    image: python:3.11-slim
    container_name: iceberg-webapp
    depends_on:
      - chroma
      - ollama
    ports:
      - "8501:8501"
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_HOST=ollama
    volumes:
      - ./app:/app
    working_dir: /app
    networks:
      - iceberg-network
    command: >
      bash -c "pip install --no-cache-dir streamlit==1.29.0 chromadb==0.4.18 pandas==2.1.4 requests==2.31.0 &&
               streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  iceberg-network:
    driver: bridge
